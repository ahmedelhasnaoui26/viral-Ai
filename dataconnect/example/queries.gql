mutation CreateAnimation($imageUrl: String!, $animationStyle: String!, $parameters: String) @auth(level: USER) {
  image_insert(data: {
    userId_expr: "auth.uid",
    imageUrl: $imageUrl,
    createdAt_expr: "request.time",
    description: "Image for animation" # Assuming a default description or it could be a variable
  }) {
    id
  }
  animation_insert(data: {
    userId_expr: "auth.uid",
    imageId: "<id-from-image-insert>", # Placeholder, will be replaced by previous mutation output
    animatedVideoUrl: "placeholder-url", # This would typically be generated by a backend process
    animationStyle: $animationStyle,
    createdAt_expr: "request.time",
    status: "PROCESSING",
    parameters: $parameters,
    isPublic: false # Default to private for new animations
  }) {
    id
  }
}

query GetUserAnimations @auth(level: USER) {
  animations(where: {userId: {eq_expr: "auth.uid"}}, orderBy: [{createdAt: DESC}]) {
    id
    animatedVideoUrl
    animationStyle
    status
    createdAt
    isPublic
    image {
      imageUrl
      description
    }
  }
}

query ListPublicAnimations($limit: Int = 10, $offset: Int = 0) @auth(level: PUBLIC, insecureReason: "This operation is safe to expose to the public as it only retrieves public animation data.") {
  animations(where: {isPublic: {eq: true}}, orderBy: [{createdAt: DESC}], limit: $limit, offset: $offset) {
    id
    animatedVideoUrl
    animationStyle
    createdAt
    user {
      displayName
    }
    image {
      imageUrl
    }
  }
}

mutation AddCommentToAnimation($animationId: UUID!, $content: String!) @auth(level: USER) {
  comment_insert(data: {
    userId_expr: "auth.uid",
    animationId: $animationId,
    content: $content,
    createdAt_expr: "request.time"
  }) {
    id
  }
}